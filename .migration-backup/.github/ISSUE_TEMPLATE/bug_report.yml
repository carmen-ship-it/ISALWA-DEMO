name: Bug report
description: Something broken in ISALWA OS
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual
    validations:
      required: true
  - type: dropdown
    id: exp
    attributes:
      label: Experience
      options:
        - Pulso
        - Radar
        - Personas
        - Territorio
        - Señal
        - Cierre
        - Comando
        - API / other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or SHA
