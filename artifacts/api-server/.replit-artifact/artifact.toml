kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/v1"]

[services.development]
run = "bash /home/runner/workspace/scripts/run-api.sh"

[services.production.build]
args = ["bash", "/home/runner/workspace/scripts/build-api.sh"]

[services.production.run]
args = ["bash", "/home/runner/workspace/scripts/run-api-prod.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/v1/health"
