kind = "web"
previewPath = "/"
title = "ISALWA OS"
version = "1.0.0"
id = "artifacts/isalwa-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20133

[services.development]
run = "bash /home/runner/workspace/scripts/run-web.sh"

[services.production.build]
args = ["bash", "/home/runner/workspace/scripts/build-web.sh"]

[services.production.run]
args = ["bash", "/home/runner/workspace/scripts/run-web-prod.sh"]

[services.env]
PORT = "20133"
BASE_PATH = "/"
