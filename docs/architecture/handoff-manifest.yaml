    - action: add_supplier
      class: A
      mechanism: Party + supplier role
    - action: add_vendor
      class: A
      mechanism: Party + supplier/vendor role
    - action: add_distributor
      class: A
    - action: add_partner
      class: A
    - action: add_contact
      class: A
    - action: correct_master_data
      class: A
    - action: change_legal_name
      class: B
    - action: change_nit
      class: B
    - action: request_party_merge
      class: B
    - action: approve_party_merge
      class: B
    - action: change_account_owner
      class: A
      note: B policy-dependent
    - action: change_payment_terms
      class: B
    - action: change_credit_limit
      class: B
    - action: change_approval_authority
      class: B
    - action: activate_capability
      class: B
