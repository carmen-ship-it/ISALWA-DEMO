first_capability_lane: commercial
finance_status: LOCKED

tenant:
  status: APPROVED
  isolation:
    field: organizationId
    rule: every_operational_row
    ai_retrieval: same_as_user_session
  lifecycle_states: [provisioning, active, suspended, archived]
  demo_isolation: APPROVED

entities:
  Person:
    lane: B
    authoritative_store: person
    status: APPROVED
    delete_policy: never_hard_delete
    notes: Workforce canonical human; distinct from Party partyKind person

  OrganizationMember:
    lane: B
    authoritative_store: organization_member
    status: APPROVED
    employment_status: [pending_start, active, on_leave, terminated]
    access_status: [invited, active, suspended, revoked]

  AuthIdentity:
    lane: A
    authoritative_store: auth_identity
    status: APPROVED

  RoleAssignment:
    lane: B
    authoritative_store: role_assignment
    status: APPROVED
    effective_dated: true

  DepartmentAssignment:
    lane: B
    authoritative_store: department_assignment
    status: APPROVED
    effective_dated: true

  ManagerAssignment:
    lane: B
    authoritative_store: manager_assignment
    status: APPROVED
    effective_dated: true

  Delegation:
    lane: B
    authoritative_store: delegation
    status: APPROVED
    expires_required: true

  Party:
    lane: C
    authoritative_store: party
    status: APPROVED
    party_kind: [organization, person]

  PartyRoleAssignment:
    lane: C
    authoritative_store: party_role_assignment
    status: APPROVED
    roles:
      - customer
      - supplier
      - vendor
      - distributor
      - partner
      - contractor
      - logistics_provider
      - financial_counterparty

  Contact:
    lane: C
    authoritative_store: contact
    status: APPROVED

  CommercialAccount:
    lane: G
    authoritative_store: commercial_account
    status: APPROVED
    alias: Account  # Foundation L1 legacy name — use CommercialAccount

  Lead:
    lane: C
    authoritative_store: lead_draft
    status: APPROVED
    staging: true

  WorkItem:
    lane: E
    authoritative_store: work_item
    status: APPROVED

  ApprovalRequest:
    lane: E
    authoritative_store: approval_request
    status: APPROVED
    outcome: immutable_terminal

  BusinessEvent:
    lane: D
    authoritative_store: business_event
    status: APPROVED
    append_only: true

  AuditLog:
    lane: D
    authoritative_store: audit_log
    status: APPROVED
    append_only: true

  FinanceProjection:
    lane: I
    authoritative_store: finance_projection
    status: LOCKED
    second_ledger: prohibited

  CapabilityState:
    lane: A
    authoritative_store: capability_state
    status: APPROVED
    states: [LOCKED, APPROVED, CONNECTING, ACTIVE, DEGRADED, DEPRECATED]

  IntegrationConnection:
    lane: H
    authoritative_store: integration_connection
    status: APPROVED

  AttentionItem:
    lane: E
    authoritative_store: derived
    status: APPROVED

  Notification:
    lane: E
    authoritative_store: notification_delivery
    status: APPROVED

  IdempotencyKey:
    lane: D
    authoritative_store: ingest_idempotency
    status: APPROVED

  Document:
    lane: H
    authoritative_store: document
    status: APPROVED

commands:
  workforce:
    - name: InviteMember
      class: A
      auth: people.admin
      events: [member.invited]
      status: APPROVED
    - name: ActivateMember
      class: A
      events: [member.activated]
      status: APPROVED
    - name: ChangeDepartment
      class: A
      events: [member.department.changed]
      status: APPROVED
    - name: ChangeRole
      class: A
      class_if_finance: B
      events: [member.role.changed]
      status: APPROVED
    - name: ChangeManager
      class: A
      events: [member.manager.changed]
      status: APPROVED
    - name: SuspendMember
      class: A
      events: [member.suspended]
      status: APPROVED
    - name: TerminateMember
      class: A
      events: [member.terminated]
      requires: open_work_reassignment
      status: APPROVED
    - name: RehireMember
      class: A
      events: [employment.restarted]
      status: APPROVED
    - name: GrantDelegation
      class: A
      class_if_approval_scope: B
      events: [delegation.granted]
      requires_expiry: true
      status: APPROVED
    - name: RevokeDelegation
      class: A
      events: [delegation.revoked]
      status: APPROVED

  party:
    - name: CreateParty
      class: A
      events: [party.created]
      status: APPROVED
    - name: UpdateParty
      class: A
      events: [party.updated]
      status: APPROVED
    - name: DeactivateParty
      class: A
      events: [party.deactivated]
      status: APPROVED
    - name: ReactivateParty
      class: A
      events: [party.reactivated]
      status: APPROVED
    - name: AssignPartyRole
      class: A
      events: [party.role.assigned]
      status: APPROVED
    - name: EndPartyRole
      class: A
      events: [party.role.ended]
      status: APPROVED
    - name: UpdateContact
      class: A
      events: [contact.updated]
      status: APPROVED
    - name: RequestPartyMerge
      class: B
      events: [party.merge.requested]
      status: APPROVED
    - name: ApprovePartyMerge
      class: B
      events: [party.merged]
      status: APPROVED
    - name: RejectPartyMerge
      class: B
      events: [party.merge.rejected]
      status: APPROVED

  location:
    - name: CreateLocation
      class: A
      events: [location.created]
      status: APPROVED
    - name: UpdateLocation
      class: A
      events: [location.updated]
      status: APPROVED
    - name: DeactivateLocation
      class: A
      events: [location.deactivated]
      status: APPROVED

  work:
    - name: CreateWorkItem
      class: A
      lane: E
      status: APPROVED
    - name: ReassignWork
      class: A
      lane: E
      events: [task.reassigned]
      status: APPROVED
    - name: CompleteWork
      class: A
      lane: E
      status: APPROVED
    - name: RequestApproval
      class: A
      lane: E
      status: APPROVED
    - name: Approve
      class: A
      lane: E
      status: APPROVED
    - name: Reject
      class: A
      lane: E
      status: APPROVED

queries:
  - name: GetMember
    lane: F
    status: APPROVED
  - name: ListMembers
