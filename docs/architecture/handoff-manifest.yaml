multi_agent_lanes:
  A:
    name: foundation_tenant_auth
    entities: [Organization, CapabilityState, AuthIdentity]
    future_packages: [packages/os-foundation]
    forbidden: [duplicate_tenant_model, browser_db_writes]
  B:
    name: workforce_authorization
    entities: [Person, OrganizationMember, RoleAssignment, DepartmentAssignment, ManagerAssignment, Delegation]
    future_packages: [packages/os-workforce]
    depends_on: [A, D]
  C:
    name: partygraph_identity
    entities: [Party, PartyRoleAssignment, Contact, Lead]
    future_packages: [packages/os-party]
    depends_on: [A, D]
    forbidden: [customer_master_silo, supplier_master_silo, vendor_master_silo]
  D:
    name: event_audit_outbox
    entities: [BusinessEvent, AuditLog, Outbox, IdempotencyKey]
    future_packages: [packages/os-events]
    forbidden: [second_event_log]
  E:
    name: work_approval_attention
    entities: [WorkItem, ApprovalRequest, AttentionItem, Notification]
    future_packages: [packages/os-work]
    depends_on: [B, C, D]
  F:
    name: query_projections
    entities: [read_models, search_indexes]
    future_packages: [packages/os-query]
    depends_on: [all_authoritative, D]
  G:
    name: commercial
    entities: [CommercialAccount, Opportunity, Quote, Order]
    future_packages: [packages/os-commercial]
    depends_on: [B, C, D, E, F]
    note: First activated lane at step 16+
    forbidden: [fork_partygraph, fork_events, fork_work]
  H:
    name: integrations
    entities: [IntegrationConnection, Document]
    future_packages: [packages/os-integrations]
    depends_on: [A, D, C]
  I:
    name: finance
    entities: [FinanceProjection]
    future_packages: [packages/os-finance]
    status: LOCKED
    depends_on: [D, H, C]
    forbidden: [second_ledger]
  J:
    name: qa_security_architecture
    entities: [contract_tests, security_gates]
    future_packages: [packages/os-contracts]
    depends_on: [all]

parallelization:
  allowed_when:
    - shared_contracts_locked
    - ownership_boundaries_explicit
    - dependencies_known
    - integration_test_boundary_defined
    - no_two_agents_same_mutable_contract
    - cross_lane_changes_reviewed
    - boundary_tests_exist
  on_cross_lane_issue:
    - FOUNDATION_GAP
    - CROSS_LANE_CHANGE_REQUEST
    - stop_at_gate

integrations:
