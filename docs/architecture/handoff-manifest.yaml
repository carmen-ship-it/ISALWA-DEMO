classification_tags:
  APPROVED: Binding architecture decision
  PROPOSED: Planning direction
  REQUIRES_CLIENT_CONFIRMATION: Needs ISALWA input
  DEFERRED: Later phase
  LOCKED: Not active
  IMPLEMENTATION_FOLLOW-UP: Resolved at implementation step

