  salvage_register: LEGACY_PRODUCT_SALVAGE_REGISTER.md
  ui_principles: UI_REBUILD_PRINCIPLES.md
  future_production_app: apps/os-web_planned
  legacy_demo_retirement: step_16_commercial_parity

